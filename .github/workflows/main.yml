name: CI devops 2025

on:
  # on veut lancer ce job sur les push et pull request des branches main et develop
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # récupère le code du repo pour que le runner puisse y accéder
      - uses: actions/checkout@v4

      # installe le JDK 21 nécessaire pour builder et tester l'application Spring Boot
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # build + exécute les tests unitaires et d'intégration (Testcontainers lance un Postgres temporaire)
      - name: Build and test with Maven
        run: mvn clean verify --file ./simpleapi/pom.xml

      - name: Use SonarCloud Scan
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=Shiteur_TP_part01-Docker -Dsonar.organization=shiteur -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }}  --file ./simple-api/pom.xml


  build-and-push:
    needs: test-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/simpleapi:latest

      - name: Build and database
        uses: docker/build-push-action@v6
        with:
          context: ./Database
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-database:latest

      - name: Build and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./HttpServer
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-httpd:latest

      - name: Build and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-front:1.0


  deploy:
    needs: build-and-push
    if: vars.ENABLE_DEPLOY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Set up SSH and Ansible Vault
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key

          ssh-keyscan -H thomas.danjou.takima.school >> ~/.ssh/known_hosts

      - name: Build Ansible image
        run: docker build -f ansible/Dockerfile.ansible -t ansible-runner ansible

      - name: Run playbook in Docker
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          mkdir -p ~/.ansible
          printf "%s\n" "$VAULT_PASS" > ~/.ansible/vault_pass
          chmod 400 ~/.ansible/vault_pass
          docker run --rm \
            -v "${{ github.workspace }}/ansible:/ansible" \
            -v "~/.ssh:/root/.ssh:ro" \
            -v "~/.ansible/vault_pass:/vault_pass:ro" \
            ansible-runner \
            -i inventories/setup.yml playbook.yml \
            --vault-password-file /vault_pass \
            -e ansible_ssh_private_key_file=/root/.ssh/deploy_key